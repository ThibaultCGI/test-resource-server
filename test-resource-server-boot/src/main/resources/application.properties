spring.application.name=test-resource-server

server.port=${env.server.port}

auth-server.path=${env.auth-server.path}
auth-server.oauth2.path=${auth-server.path}/oauth2
auth-server.oauth2.token-path=${auth-server.oauth2.path}/token
auth-server.oauth2.jwks-path=${auth-server.oauth2.path}/jwks

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${auth-server.oauth2.jwks-path}
